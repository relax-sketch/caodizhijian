id: ADD_GRASS_006
sourceId: grassland-additional-20260526
enabled: true
severity: ADVISORY
targetTable: YD_TRCY_PT
title: 草地型与草地类关系需核对
explanation: 草地型应与草地类对应；草地型填写为其他或为空时，其他草地型字段必须填写。
requiredTables:
  - YD_TRCY_PT
requiredFields:
  - YD_ID
  - CD_L
  - CD_XING
  - CD_XING_QT
locatorFields:
  - YD_ID
sql: |-
  SELECT YD_ID, CD_L AS '草地类', CD_XING AS '草地型', CD_XING_QT AS '其他草地型' FROM "YD_TRCY_PT" WHERE YD_ID = :ydId AND ((CD_XING IS NULL OR TRIM(CAST(CD_XING AS TEXT)) = '') OR (CD_XING = '826' AND (CD_XING_QT IS NULL OR TRIM(CAST(CD_XING_QT AS TEXT)) = '')))
