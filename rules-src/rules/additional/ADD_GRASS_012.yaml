id: ADD_GRASS_012
sourceId: grassland-additional-20260526
enabled: true
severity: ADVISORY
targetTable: YD_TRCY_PT
title: 草群平均高度超出 5 至 100
explanation: 草群平均高度低于 5 或高于 100 时提示人工检查核对。
requiredTables:
  - YD_TRCY_PT
requiredFields:
  - YD_ID
  - ZBGD
locatorFields:
  - YD_ID
sql: |-
  SELECT YD_ID, ZBGD AS '草群平均高度' FROM "YD_TRCY_PT" WHERE YD_ID = :ydId AND (ZBGD IS NOT NULL AND (CAST(ZBGD AS REAL) < 5 OR CAST(ZBGD AS REAL) > 100))
