id: ADD_GRASS_014
sourceId: grassland-additional-20260526
enabled: true
severity: ADVISORY
targetTable: YD_TRCY_PT
title: 单位面积干草产量超过 4000
explanation: 单位面积干草产量超过 4000 时提示人工检查核对。
requiredTables:
  - YD_TRCY_PT
requiredFields:
  - YD_ID
  - GC_CL
locatorFields:
  - YD_ID
sql: |-
  SELECT YD_ID, GC_CL AS '单位面积干草产量' FROM "YD_TRCY_PT" WHERE YD_ID = :ydId AND (GC_CL IS NOT NULL AND CAST(GC_CL AS REAL) > 4000)
