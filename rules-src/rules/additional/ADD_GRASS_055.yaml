id: ADD_GRASS_055
sourceId: grassland-additional-20260526
enabled: true
severity: ADVISORY
targetTable: YF_TRCYGC_TB
title: 观测样方盖度低于 60%
explanation: 观测样方盖度低于 60% 时提示人工检查核对。
requiredTables:
  - YF_TRCYGC_TB
requiredFields:
  - YD_ID
  - YF_ID
  - ZGD
locatorFields:
  - YD_ID
  - YF_ID
sql: |-
  SELECT YD_ID, YF_ID, ZGD AS '观测样方盖度' FROM "YF_TRCYGC_TB" WHERE YD_ID = :ydId AND (ZGD IS NOT NULL AND CAST(ZGD AS REAL) < 60)
