id: ADD_GRASS_016
sourceId: grassland-additional-20260526
enabled: true
severity: ADVISORY
targetTable: YD_TRCY_PT
title: 鲜草产量与干草产量比值超出 1 至 4
explanation: 单位面积鲜草产量/单位面积干草产量超出 1 至 4 时提示人工检查核对。
requiredTables:
  - YD_TRCY_PT
requiredFields:
  - YD_ID
  - XC_CL
  - GC_CL
locatorFields:
  - YD_ID
sql: |-
  SELECT YD_ID, XC_CL AS '单位面积鲜草产量', GC_CL AS '单位面积干草产量' FROM "YD_TRCY_PT" WHERE YD_ID = :ydId AND (XC_CL IS NOT NULL AND GC_CL IS NOT NULL AND CAST(GC_CL AS REAL) <> 0 AND (CAST(XC_CL AS REAL) / CAST(GC_CL AS REAL) < 1 OR CAST(XC_CL AS REAL) / CAST(GC_CL AS REAL) > 4))
