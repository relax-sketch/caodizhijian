id: ADD_GRASS_026
sourceId: grassland-additional-20260526
enabled: true
severity: MANDATORY
targetTable: YD_TRCY_PT
title: 划区轮牧不是否
explanation: 划区轮牧统一填写为否。
requiredTables:
  - YD_TRCY_PT
requiredFields:
  - YD_ID
  - HQLM
locatorFields:
  - YD_ID
sql: |-
  SELECT YD_ID, HQLM AS '划区轮牧' FROM "YD_TRCY_PT" WHERE YD_ID = :ydId AND ((HQLM IS NULL OR TRIM(CAST(HQLM AS TEXT)) = '') OR HQLM <> '2')
