id: ADD_GRASS_007
sourceId: grassland-additional-20260526
enabled: true
severity: MANDATORY
targetTable: YD_TRCY_PT
title: 草地起源不是天然草原
explanation: 天然草原样地的草地起源统一填写为天然草原。
requiredTables:
  - YD_TRCY_PT
requiredFields:
  - YD_ID
  - CD_LB
locatorFields:
  - YD_ID
sql: |-
  SELECT YD_ID, CD_LB AS '草地起源' FROM "YD_TRCY_PT" WHERE YD_ID = :ydId AND ((CD_LB IS NULL OR TRIM(CAST(CD_LB AS TEXT)) = '') OR CD_LB <> '1')
