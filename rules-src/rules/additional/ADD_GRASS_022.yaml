id: ADD_GRASS_022
sourceId: grassland-additional-20260526
enabled: true
severity: ADVISORY
targetTable: YD_TRCY_PT
title: 单位面积鲜草产量大于 20000
explanation: 天然草原样地单位面积鲜草产量大于 20000 时，请核实测产样方调查数据。
requiredTables:
  - YD_TRCY_PT
requiredFields:
  - YD_ID
  - XC_CL
locatorFields:
  - YD_ID
sql: |-
  SELECT YD_ID, XC_CL AS '单位面积鲜草产量' FROM "YD_TRCY_PT" WHERE YD_ID = :ydId AND (XC_CL IS NOT NULL AND CAST(XC_CL AS REAL) > 20000)
