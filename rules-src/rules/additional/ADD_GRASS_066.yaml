id: ADD_GRASS_066
sourceId: grassland-additional-20260526
enabled: true
severity: ADVISORY
targetTable: ZWDCB_GCYF_TB
title: 观测优势植物盖度占比低于 60%
explanation: 观测样方优势植物盖度之和小于观测样方总盖度的 60% 时提示核对。
requiredTables:
  - YF_TRCYGC_TB
  - ZWDCB_GCYF_TB
requiredFields:
  - YD_ID
  - YF_ID
  - YOUSHIZHONG
  - FVC
locatorFields:
  - YD_ID
  - YF_ID
sql: |-
  SELECT s.YD_ID, s.YF_ID, SUM(CASE WHEN p.YOUSHIZHONG = "1" THEN CAST(p.FVC AS REAL) ELSE 0 END) AS "优势植物盖度和", s.ZGD AS "观测样方总盖度" FROM "YF_TRCYGC_TB" s JOIN "ZWDCB_GCYF_TB" p ON p.XB_GLH = s.MZGUID WHERE s.YD_ID = :ydId GROUP BY s.YD_ID, s.YF_ID, s.ZGD HAVING s.ZGD IS NOT NULL AND SUM(CASE WHEN p.YOUSHIZHONG = "1" THEN CAST(p.FVC AS REAL) ELSE 0 END) < CAST(s.ZGD AS REAL) * 0.6
