id: ADD_GRASS_009
sourceId: grassland-additional-20260526
enabled: true
severity: MANDATORY
targetTable: YD_TRCY_PT
title: 植被覆盖类型未填写或与植被结构不对应
explanation: 植被覆盖类型必填，且应与植被结构对应。
requiredTables:
  - YD_TRCY_PT
requiredFields:
  - YD_ID
  - VEGECOVER_TYPE
  - ZB_JG
locatorFields:
  - YD_ID
sql: |-
  SELECT YD_ID, VEGECOVER_TYPE AS '植被覆盖类型', ZB_JG AS '植被结构' FROM "YD_TRCY_PT" WHERE YD_ID = :ydId AND ((VEGECOVER_TYPE IS NULL OR TRIM(CAST(VEGECOVER_TYPE AS TEXT)) = '') OR (ZB_JG = '1' AND VEGECOVER_TYPE <> '2100') OR (ZB_JG = '2' AND VEGECOVER_TYPE <> '2200'))
