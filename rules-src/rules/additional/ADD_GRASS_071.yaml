id: ADD_GRASS_071
sourceId: grassland-additional-20260526
enabled: true
severity: ADVISORY
targetTable: YF_TRCYGC_TB
title: 观测样方草群平均高偏离主要推荐高度
explanation: 主要推荐高度按覆盖度百分比加权计算：SUM(FVC / 100 * H)，偏差超过 0.5 厘米时提示核对。
requiredTables:
  - YF_TRCYGC_TB
  - ZWDCB_GCYF_TB
requiredFields:
  - YD_ID
  - YF_ID
  - CQPJ_GD
  - MZGUID
locatorFields:
  - YD_ID
  - YF_ID
sql: |-
  WITH stats AS (SELECT s.YD_ID, s.YF_ID, s.CQPJ_GD, SUM(CAST(p.FVC AS REAL) / 100.0 * CAST(p.H AS REAL)) AS recommended_height FROM "YF_TRCYGC_TB" s JOIN "ZWDCB_GCYF_TB" p ON p.XB_GLH = s.MZGUID WHERE s.YD_ID = :ydId AND s.CQPJ_GD IS NOT NULL AND p.H IS NOT NULL AND p.FVC IS NOT NULL GROUP BY s.YD_ID, s.YF_ID, s.CQPJ_GD HAVING COUNT(p.PK_UID) > 0) SELECT YD_ID, YF_ID, CQPJ_GD AS "草群平均高度", recommended_height AS "主要推荐高度" FROM stats WHERE ABS(CAST(CQPJ_GD AS REAL) - recommended_height) > 0.5
