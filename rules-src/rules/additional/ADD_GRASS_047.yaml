id: ADD_GRASS_047
sourceId: grassland-additional-20260526
enabled: true
severity: MANDATORY
targetTable: YF_TRCYCC_TB
title: 测产样方总盖度大于植物盖度合计
explanation: 样方总盖度不应大于植物调查分表盖度值之和。
requiredTables:
  - YF_TRCYCC_TB
  - ZWDCB_CCYF_TB
requiredFields:
  - YD_ID
  - YF_ID
  - ZGD
  - MZGUID
locatorFields:
  - YD_ID
  - YF_ID
sql: |-
  SELECT s.YD_ID, s.YF_ID, s.ZGD AS "样方总盖度", SUM(CAST(p.FVC AS REAL)) AS "植物盖度合计" FROM "YF_TRCYCC_TB" s JOIN "ZWDCB_CCYF_TB" p ON p.XB_GLH = s.MZGUID WHERE s.YD_ID = :ydId AND s.ZGD IS NOT NULL AND p.FVC IS NOT NULL GROUP BY s.YD_ID, s.YF_ID, s.ZGD HAVING COUNT(p.PK_UID) > 0 AND CAST(s.ZGD AS REAL) > SUM(CAST(p.FVC AS REAL))
