id: ADD_GRASS_040
sourceId: grassland-additional-20260526
enabled: true
severity: MANDATORY
targetTable: YF_TRCYCC_TB
title: 测产样方不足 3 个
explanation: 一个样地必须有 3 个测产样方。
requiredTables:
  - YF_TRCYCC_TB
requiredFields:
  - YD_ID
locatorFields:
  - YD_ID
sql: |-
  SELECT YD_ID, COUNT(*) AS "测产样方数量" FROM "YF_TRCYCC_TB" WHERE YD_ID = :ydId GROUP BY YD_ID HAVING COUNT(*) <> 3
