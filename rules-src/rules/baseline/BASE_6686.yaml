id: BASE_6686
sourceId: zdb-baseline-20260526
enabled: true
severity: MANDATORY
targetTable: YD_JM_PT
title: 加密测产样方不足3个
explanation: 来源于 ZDB 内置启用规则：加密测产样方不足3个。
requiredTables:
  - YD_JM_PT
  - YF_JMCC_TB
requiredFields:
  - YD_ID
  - XIAN
  - XIANG
  - CUN
locatorFields:
  - XIAN
  - XIANG
  - CUN
  - YD_ID
sql: |-
  SELECT * FROM "YD_JM_PT" WHERE YD_ID = :ydId AND (MZGUID IN(SELECT D.MZGUID FROM (SELECT A.MZGUID,C.YXSL FROM YD_JM_PT A LEFT JOIN (SELECT B.XB_GLH,COUNT(B.XB_GLH) AS YXSL FROM YF_JMCC_TB B GROUP BY B.XB_GLH) C ON A.MZGUID=C.XB_GLH) D WHERE D.YXSL<3))
