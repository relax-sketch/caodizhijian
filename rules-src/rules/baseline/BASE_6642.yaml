id: BASE_6642
sourceId: zdb-baseline-20260526
enabled: true
severity: MANDATORY
targetTable: YD_TRCY_PT
title: 样线不足3条
explanation: 来源于 ZDB 内置启用规则：样线不足3条。
requiredTables:
  - YD_TRCY_PT
  - YX_TRCY_TB
requiredFields:
  - YD_ID
  - XIAN
  - XIANG
  - CUN
locatorFields:
  - XIAN
  - XIANG
  - CUN
  - YD_ID
sql: |-
  SELECT * FROM "YD_TRCY_PT" WHERE YD_ID = :ydId AND (MZGUID IN(SELECT D.MZGUID FROM (SELECT A.MZGUID,C.YXSL FROM YD_TRCY_PT A LEFT JOIN (SELECT B.XB_GLH,COUNT(B.XB_GLH) AS YXSL FROM YX_TRCY_TB B GROUP BY B.XB_GLH) C ON A.MZGUID=C.XB_GLH) D WHERE D.YXSL<3))
