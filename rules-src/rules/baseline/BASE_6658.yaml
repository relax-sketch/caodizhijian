id: BASE_6658
sourceId: zdb-baseline-20260526
enabled: true
severity: MANDATORY
targetTable: YD_JM_PT
title: 样地中心点GNSS坐标Y为空或整数位小于7位
explanation: 来源于 ZDB 内置启用规则：样地中心点GNSS坐标Y为空或整数位小于7位。
requiredTables:
  - YD_JM_PT
requiredFields:
  - YD_ID
  - XIAN
  - XIANG
  - CUN
locatorFields:
  - XIAN
  - XIANG
  - CUN
  - YD_ID
sql: |-
  SELECT * FROM "YD_JM_PT" WHERE YD_ID = :ydId AND (LENGTH(ROUND(ZUOBIAO_X,0))<7 OR ZUOBIAO_Y IS NULL OR ZUOBIAO_Y =0 OR TRIM(ZUOBIAO_Y)='')
