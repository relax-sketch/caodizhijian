id: BASE_6645
sourceId: zdb-baseline-20260526
enabled: true
severity: MANDATORY
targetTable: YD_TRCY_PT
title: 样线长度不一致
explanation: 来源于 ZDB 内置启用规则：样线长度不一致。
requiredTables:
  - YD_TRCY_PT
  - YX_TRCY_TB
requiredFields:
  - YD_ID
  - XIAN
  - XIANG
  - CUN
locatorFields:
  - XIAN
  - XIANG
  - CUN
  - YD_ID
sql: |-
  SELECT * FROM "YD_TRCY_PT" WHERE YD_ID = :ydId AND (MZGUID IN (SELECT B.XB_GLH FROM (SELECT A.XB_GLH,A.YX_CD FROM YX_TRCY_TB A GROUP BY A.XB_GLH,A.YX_CD) B GROUP BY B.XB_GLH HAVING COUNT(*)>1))
