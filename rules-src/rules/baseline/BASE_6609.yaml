targetTable: YD_TRCY_PT
title: 样地中心点GNSS坐标X为空或整数位小于8位
explanation: 来源于 ZDB 内置启用规则：样地中心点GNSS坐标X为空或整数位小于8位。
requiredTables:
  - YD_TRCY_PT
requiredFields:
  - YD_ID
  - XIAN
  - XIANG
  - CUN
locatorFields:
  - XIAN
  - XIANG
  - CUN
  - YD_ID
sql: |-
  SELECT * FROM "YD_TRCY_PT" WHERE YD_ID = :ydId AND (LENGTH(ROUND(ZUOBIAO_X,0))<8 OR ZUOBIAO_X IS NULL OR ZUOBIAO_X =0 OR TRIM(ZUOBIAO_X)='')
